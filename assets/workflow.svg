<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 302" role="img" aria-labelledby="title desc">
<title id="title">One-click Obsidian to LaTeX workflow</title>
<desc id="desc">The active Obsidian note is passed through the Shell Commands plugin to a Python Markdown-to-LaTeX converter. Shell Commands copies the script's standard output to the clipboard, then the user pastes it into their LaTeX project. SVG-to-PDF artwork conversion happens independently.</desc>
<rect width="1040" height="302" rx="22" fill="#f7f9fc"/>
<text x="34" y="42" fill="#17283d" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">One-click Obsidian workflow</text>
<text x="34" y="66" fill="#54667a" font-family="Arial,Helvetica,sans-serif" font-size="14">The converter writes LaTeX to stdout; Obsidian handles the clipboard.</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <rect x="30" y="105" width="174" height="104" rx="15" fill="#e1edfa" stroke="#9fc4e5" stroke-width="1.5"/>
  <text x="117" y="144" font-size="18" font-weight="700" fill="#194776">Obsidian note</text>
  <text x="117" y="168" font-size="13" fill="#3d607d">Markdown + links</text>
  <text x="117" y="185" font-size="13" fill="#3d607d">equations + figures</text>
  <rect x="234" y="105" width="174" height="104" rx="15" fill="#e8edf5" stroke="#bbc9dc" stroke-width="1.5"/>
  <text x="321" y="144" font-size="18" font-weight="700" fill="#273c59">Shell Commands</text>
  <text x="321" y="168" font-size="13" fill="#52667d">passes current note</text>
  <text x="321" y="185" font-size="13" fill="#52667d">path to Python</text>
  <rect x="438" y="105" width="174" height="104" rx="15" fill="#dcece9" stroke="#9bc4bc" stroke-width="1.5"/>
  <text x="525" y="144" font-size="18" font-weight="700" fill="#205a53">Python converter</text>
  <text x="525" y="168" font-size="13" fill="#386e66">writes LaTeX</text>
  <text x="525" y="185" font-size="13" fill="#386e66">to standard output</text>
  <rect x="642" y="105" width="174" height="104" rx="15" fill="#e8edf5" stroke="#bbc9dc" stroke-width="1.5"/>
  <text x="729" y="144" font-size="18" font-weight="700" fill="#273c59">Clipboard</text>
  <text x="729" y="168" font-size="13" fill="#52667d">via Shell Commands</text>
  <text x="729" y="185" font-size="13" fill="#52667d">stdout setting</text>
  <rect x="846" y="105" width="164" height="104" rx="15" fill="#e1edfa" stroke="#9fc4e5" stroke-width="1.5"/>
  <text x="928" y="144" font-size="18" font-weight="700" fill="#194776">LaTeX project</text>
  <text x="928" y="168" font-size="13" fill="#3d607d">paste or include</text>
  <text x="928" y="185" font-size="13" fill="#3d607d">the body source</text>
</g>
<g stroke="#59718a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M211 157H225M220 151l6 6-6 6"/><path d="M415 157H429M424 151l6 6-6 6"/><path d="M619 157H633M628 151l6 6-6 6"/><path d="M823 157H837M832 151l6 6-6 6"/>
</g>
<rect x="30" y="235" width="980" height="43" rx="10" fill="#ffffff" stroke="#dbe3ed"/>
<text x="49" y="261" fill="#52667d" font-family="Arial,Helvetica,sans-serif" font-size="14"><tspan font-weight="700" fill="#273c59">Separate artwork step:</tspan> SVG → Inkscape (optional helper) → same-stem PDF for LaTeX.</text>
</svg>
